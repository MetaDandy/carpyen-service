info:
  name: /
  type: http
  seq: 2

http:
  method: GET
  url: "{{url}}/batch_materials?limit=10&offset=0"
  params:
    - name: limit
      value: "10"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

runtime:
  variables:
    - name: url
      value: http://127.0.0.1:8000/api/v1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
