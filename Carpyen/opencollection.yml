opencollection: 1.0.0

info:
  name: Carpyen
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{authToken}}"
  variables:
    - name: url
      value: http://127.0.0.1:8000/api/v1
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
